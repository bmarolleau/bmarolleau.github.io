<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dark background -->
  <rect width="200" height="200" fill="#161616"/>
  <!-- Top-left small square -->
  <rect x="28" y="28" width="42" height="42" fill="none" stroke="#ee0000" stroke-width="7"/>
  <!-- Bottom-right small square -->
  <rect x="130" y="130" width="42" height="42" fill="none" stroke="#ee0000" stroke-width="7"/>
  <!-- Up arrow (left side) -->
  <line x1="49" y1="160" x2="49" y2="85" stroke="#ee0000" stroke-width="7" stroke-linecap="square"/>
  <line x1="49" y1="130" x2="122" y2="130" stroke="#ee0000" stroke-width="7" stroke-linecap="square"/>
  <polyline points="33,100 49,80 65,100" fill="none" stroke="#ee0000" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Down arrow (right side) -->
  <line x1="151" y1="40" x2="151" y2="115" stroke="#ee0000" stroke-width="7" stroke-linecap="square"/>
  <line x1="78" y1="70" x2="151" y2="70" stroke="#ee0000" stroke-width="7" stroke-linecap="square"/>
  <polyline points="135,100 151,120 167,100" fill="none" stroke="#ee0000" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square"/>
</svg>
