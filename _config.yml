title: "Field Notes"
author: Benoit Marolleau

# Subtitle shown under the title on the navbar
description: >-
  AI · IBM i & Z · Cloud · IoT · DevOps — real projects, honest notes.

# ── Navbar links ──────────────────────────────────────────────
navbar-links:
  Home: "/"
  IBM Bob: "topics/ai-bob/"
  "IBM i / Z": "topics/ibm-i-z/"
  "Data & Streaming": "topics/data/"
  Cloud: "topics/cloud/"
  IoT: "topics/iot/"
  DevOps: "topics/devops-iac/"
  Archive: "topics/misc/"

# ── Avatar ────────────────────────────────────────────────────
avatar: "/assets/img/Redhat-BenoitMarolleauPixel128x128.png"
round-avatar: true

# ── Custom CSS ────────────────────────────────────────────────
site-css:
  - "/assets/css/custom.css"

# ── Footer social links ───────────────────────────────────────
social-network-links:
  linkedin: benoit-marolleau
  github: bmarolleau
  email: benoit.marolleau@fr.ibm.com
  rss: true

# ── Colours ───────────────────────────────────────────────────
navbar-col: "#1a1a1a"
navbar-text-col: "#d4d4d4"
navbar-border-col: "#333333"
footer-col: "#1a1a1a"
footer-text-col: "#999999"
footer-link-col: "#aaaaaa"
footer-hover-col: "#ffffff"
page-col: "#ffffff"

# ── Post list settings ────────────────────────────────────────
feed_show_excerpt: true
excerpt_length: 40
feed_show_tags: false

# ── Site settings ─────────────────────────────────────────────
baseurl: ""
url: "https://bmarolleau.github.io"
github_username: bmarolleau
twitter_username: MarolleauBenoit

# ── Build settings ────────────────────────────────────────────
theme: beautiful-jekyll-theme
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 20
paginate_path: "/page:num/"

date_format: "%B %-d, %Y"
timezone: "Europe/Paris"
markdown: kramdown
highlighter: rouge

future: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      show-avatar: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bob/
  - AGENTS.md
  - github.io.code-workspace
  - vendor/
